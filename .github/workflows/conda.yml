name: Conda

on:
  push:
    branches:
      - master
      - 'dev**'
  pull_request:
  merge_group:
  release:
    types:
      - released

# Supersede in-progress pull-request runs; queue everything else so two runs on one ref never race.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  conda-win:
    # Package build (40-60 min, uncached): too slow to gate merges. Skipped on pull requests and in the
    # merge queue (a skipped job reports as passing); runs on branch pushes and releases.
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
    - uses: actions/checkout@v7
      with:
       path: workspace/src/tesseract
    - name: install-depends
      shell: cmd
      run: |
        python -m pip install vcs2l setuptools -q
    - name: vcs import
      run: >
        vcs import --input "${{ github.workspace }}/workspace/src/tesseract/.github/workflows/windows_dependencies.repos" workspace/src/
    - uses: conda-incubator/setup-miniconda@v4
      with:
        channel-priority: strict
        environment-file: workspace/src/tesseract/.github/workflows/conda/environment.yml
        activate-environment: tesseract-build
        channels: conda-forge
        conda-remove-defaults: "true"
    - name: build and test
      run: |
        conda info
        conda list

        mkdir conda
        xcopy /E workspace\src\tesseract\.github\workflows\conda conda
        cd conda
        conda-smithy regenerate --no-check-uptodate
        
        rattler-build build -m .ci_support/win_64_.yaml --recipe recipe/recipe.yaml

  conda-linux:
    # Package build (40-60 min, uncached): too slow to gate merges. Skipped on pull requests and in the
    # merge queue (a skipped job reports as passing); runs on branch pushes and releases.
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
    - uses: actions/checkout@v7
      with:
        path: workspace/src/tesseract
    - name: install-depends
      run: |
        python -m pip install vcs2l setuptools -q
    - name: vcs import
      run: >
        vcs import --input "${{ github.workspace }}/workspace/src/tesseract/.github/workflows/windows_dependencies.repos" workspace/src/
    - uses: conda-incubator/setup-miniconda@v4
      with:
        channel-priority: strict
        environment-file: workspace/src/tesseract/.github/workflows/conda/environment.yml
        activate-environment: tesseract-build
        channels: conda-forge
        conda-remove-defaults: "true"
    - name: build and test
      run: |
        conda info
        conda list
        
        cp -r workspace/src/tesseract/.github/workflows/conda ./conda
        cd conda
        conda-smithy regenerate --no-check-uptodate
        
        rattler-build build -m .ci_support/linux_64_.yaml --recipe recipe/recipe.yaml

  conda-mac:
    # Package build (40-60 min, uncached): too slow to gate merges. Skipped on pull requests and in the
    # merge queue (a skipped job reports as passing); runs on branch pushes and releases.
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    runs-on: macos-15-intel
    defaults:
      run:
        shell: bash -el {0}
    steps:
    - uses: actions/checkout@v7
      with:
        path: workspace/src/tesseract
    - name: install-depends
      run: |
        python -m pip install vcs2l -q
    - name: vcs import
      run: >
        vcs import --input "${{ github.workspace }}/workspace/src/tesseract/.github/workflows/windows_dependencies.repos" workspace/src/
    - uses: conda-incubator/setup-miniconda@v4
      with:
        channel-priority: strict
        environment-file: workspace/src/tesseract/.github/workflows/conda/environment.yml
        activate-environment: tesseract-build
        channels: conda-forge
        conda-remove-defaults: "true"
    - name: build and test
      run: |
        conda info
        conda list
        
        cp -r workspace/src/tesseract/.github/workflows/conda ./conda
        cd conda
        conda-smithy regenerate --no-check-uptodate
        
        rattler-build build -m .ci_support/osx_64_.yaml  --recipe recipe/recipe.yaml
